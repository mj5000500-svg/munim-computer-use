name: Deprecate MCP Registry Entry

# The registry keys a server on its name, so renaming the server publishes a new
# entry and leaves the old one active. This marks a superseded name (or a bad
# version) deprecated, using the same GitHub OIDC identity as the publish job.
on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server name, e.g. io.github.munimtechnologies/computer-use"
        required: true
      version:
        description: "Version to update (ignored when all-versions is true)"
        required: false
      all_versions:
        description: "Apply to every version of the server"
        type: boolean
        default: false
      status:
        description: "New status"
        type: choice
        options: [deprecated, active, deleted]
        default: deprecated
      message:
        description: "Message shown to clients"
        required: false
        default: "Renamed to io.github.munimtechnologies/munim-computer-use"

jobs:
  deprecate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Update status
        env:
          SERVER: ${{ inputs.server }}
          VERSION: ${{ inputs.version }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.message }}
          ALL: ${{ inputs.all_versions }}
        run: |
          set -eu
          if [ "$ALL" = "true" ]; then
            ./mcp-publisher status --status "$STATUS" --message "$MESSAGE" --all-versions "$SERVER"
          else
            [ -n "$VERSION" ] || { echo "version is required unless all-versions is set" >&2; exit 1; }
            ./mcp-publisher status --status "$STATUS" --message "$MESSAGE" "$SERVER" "$VERSION"
          fi
